apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: revisia
resources:
  - ../../base
# Jenkins remplace ces tags à chaque déploiement (kustomize edit set image)
images:
  - name: revisia-mcp
    newName: registry.example.com/revisia/revisia-mcp
    newTag: latest
  - name: revisia-backend
    newName: registry.example.com/revisia/revisia-backend
    newTag: latest
  - name: revisia-frontend
    newName: registry.example.com/revisia/revisia-frontend
    newTag: latest
patches:
  - target:
      kind: PersistentVolumeClaim
      name: revisia-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: StatefulSet
      name: revisia-neo4j
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
  - target:
      kind: Ingress
      name: revisia
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /spec/tls
        value:
          - hosts: ["revisia.example.com"]
            secretName: revisia-tls
