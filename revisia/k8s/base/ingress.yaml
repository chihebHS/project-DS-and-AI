apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: revisia
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: revisia.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: revisia-frontend
                port:
                  name: http
