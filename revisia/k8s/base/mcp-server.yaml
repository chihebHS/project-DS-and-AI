# Serveur MCP = seule couche d'accès aux données : SQLite + ChromaDB sur un volume persistant,
# graphe de connaissances dans Neo4j. Une seule réplique : SQLite et ChromaDB n'ont qu'un écrivain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: revisia-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revisia-mcp
  labels:
    app.kubernetes.io/name: revisia
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: Recreate # le volume RWO ne peut pas être monté par deux pods à la fois
  selector:
    matchLabels:
      app.kubernetes.io/name: revisia
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revisia
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: revisia-mcp
          ports:
            - name: mcp
              containerPort: 8765
          env:
            - name: DATA_DIR
              value: /data
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: 0.0.0.0
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            - name: NEO4J_URI
              value: bolt://revisia-neo4j:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revisia-secrets
                  key: NEO4J_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # ChromaDB/ONNX peuvent écrire dans le cache du HOME : système de fichiers laissé inscriptible
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: revisia-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: revisia-mcp
spec:
  selector:
    app.kubernetes.io/name: revisia
    app.kubernetes.io/component: mcp-server
  ports:
    - name: mcp
      port: 8765
      targetPort: mcp
