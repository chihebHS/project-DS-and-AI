# Base de données graphe Neo4j : stocke le graphe de connaissances (cours, chapitres, notions,
# compétences, prérequis, dépendances). Seul le serveur MCP s'y connecte (voir networkpolicy.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: revisia-neo4j
  labels:
    app.kubernetes.io/name: revisia
    app.kubernetes.io/component: neo4j
spec:
  serviceName: revisia-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: revisia
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: revisia
        app.kubernetes.io/component: neo4j
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          ports:
            - name: bolt
              containerPort: 7687
            - name: browser
              containerPort: 7474
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: revisia-secrets
                  key: NEO4J_PASSWORD
            - name: NEO4J_AUTH
              value: neo4j/$(NEO4J_PASSWORD)
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: bolt
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: browser
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: revisia-neo4j
spec:
  selector:
    app.kubernetes.io/name: revisia
    app.kubernetes.io/component: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: browser
      port: 7474
      targetPort: browser
