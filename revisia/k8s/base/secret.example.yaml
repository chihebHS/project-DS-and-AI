# Exemple seulement : ce fichier n'est PAS appliqué par kustomize.
# Créer le vrai secret avec :
#   kubectl -n revisia create secret generic revisia-secrets \n#     --from-literal=GROQ_API_KEY=gsk_... --from-literal=NEO4J_PASSWORD=un-mot-de-passe-solide
# En production, préférer Sealed Secrets, External Secrets Operator ou Vault.
apiVersion: v1
kind: Secret
metadata:
  name: revisia-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "remplacer-par-la-cle-groq"
  NEO4J_PASSWORD: "remplacer-par-un-mot-de-passe"
