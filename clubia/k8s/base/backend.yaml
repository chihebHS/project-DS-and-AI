# API + agents LangGraph. Une réplique par défaut : la mémoire des conversations est un
# checkpointer SQLite sur volume. Pour monter en charge : checkpointer Postgres ou Redis.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clubia-backend-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clubia-backend
  labels:
    app.kubernetes.io/name: clubia
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clubia
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clubia
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: clubia-backend
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: clubia-config
            - secretRef:
                name: clubia-secrets
          env:
            - name: STATE_DIR
              value: /state
            - name: UPLOAD_TMP_DIR
              value: /tmp
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: clubia-backend-state
        - name: tmp
          emptyDir:
            sizeLimit: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clubia-backend
spec:
  selector:
    app.kubernetes.io/name: clubia
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8001
      targetPort: http
