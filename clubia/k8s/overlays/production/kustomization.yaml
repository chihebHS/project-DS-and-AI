apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clubia
resources:
  - ../../base
# Jenkins remplace ces tags à chaque déploiement (kustomize edit set image)
images:
  - name: clubia-mcp
    newName: registry.example.com/clubia/clubia-mcp
    newTag: latest
  - name: clubia-backend
    newName: registry.example.com/clubia/clubia-backend
    newTag: latest
  - name: clubia-frontend
    newName: registry.example.com/clubia/clubia-frontend
    newTag: latest
patches:
  - target:
      kind: PersistentVolumeClaim
      name: clubia-data
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: Ingress
      name: clubia
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
      - op: add
        path: /spec/tls
        value:
          - hosts: ["clubia.example.com"]
            secretName: clubia-tls
